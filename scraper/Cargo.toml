[package]
name = "wp2static_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.20"
dom-content-extraction = "0.3"
url = "2.5"
anyhow = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
html2md = "0.2"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
