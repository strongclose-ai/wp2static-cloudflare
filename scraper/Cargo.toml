[package]
name = "wp2static_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"
anyhow = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"

# Optional dependencies for future CDN migration feature
scraper = { version = "0.20", optional = true }

[features]
default = []
cdn-migration = ["scraper"]
